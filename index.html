<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07182c">
<link rel="manifest" href="manifest.webmanifest">

<title>AWO — Aviation Weather Operations</title>

<style>
:root{
  --bg:#061527;
  --panel:#0b2746;
  --panel2:#103759;
  --panel3:#081e36;
  --text:#f6f9fc;
  --muted:#afc0d1;
  --line:#315473;
  --yellow:#ffd21f;
  --blue:#2678d9;
  --green:#159447;
  --amber:#d4a10b;
  --red:#c83232;
  --purple:#8149aa;
  --grey:#65707c;
  --input:#061a2f;
}

[data-theme="light"]{
  --bg:#eef3f8;
  --panel:#ffffff;
  --panel2:#e7edf4;
  --panel3:#f5f8fb;
  --text:#10243a;
  --muted:#5b6b7b;
  --line:#bcc8d4;
  --yellow:#9b7200;
  --input:#ffffff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{cursor:pointer}

.hidden{display:none!important}

header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background:var(--panel);
  border-bottom:2px solid var(--yellow);
}

.brand{
  color:var(--yellow);
  font-weight:900;
  font-size:18px;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 12px;
  min-height:42px;
  background:var(--panel2);
  color:var(--text);
}

.btn.primary{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
  font-weight:800;
}

.btn.success{
  background:var(--green);
  border-color:var(--green);
  color:white;
}

.btn.danger{
  background:var(--red);
  border-color:var(--red);
  color:white;
}

.btn.yellow{
  background:var(--amber);
  border-color:var(--amber);
  color:#07182c;
  font-weight:800;
}

.btn.purple{
  background:var(--purple);
  border-color:var(--purple);
  color:white;
}

main{
  max-width:1250px;
  margin:auto;
  padding:12px;
}

.loginWrap{
  min-height:100vh;
  display:grid;
  place-items:center;
}

.loginCard{
  width:min(440px,95vw);
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:16px;
  padding:24px;
}

.logo{
  width:82px;
  height:82px;
  border:3px solid var(--yellow);
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:auto;
  color:var(--yellow);
  font-weight:900;
  font-size:24px;
}

.loginCard h1{
  text-align:center;
  color:var(--yellow);
  font-size:24px;
}

label{
  display:block;
  color:var(--yellow);
  font-size:12px;
  font-weight:800;
  margin:10px 0 5px;
}

input,select,textarea{
  width:100%;
  min-height:44px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--input);
  color:var(--text);
}

textarea{min-height:90px}

.nav{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:12px;
}

.nav button.active{
  border-color:var(--yellow);
  color:var(--yellow);
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  margin-bottom:12px;
  overflow:hidden;
}

.cardTitle{
  padding:11px 13px;
  background:var(--panel2);
  color:var(--yellow);
  font-weight:900;
}

.cardBody{padding:13px}

.grid{
  display:grid;
  gap:10px;
}

.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.kpi{
  background:var(--panel3);
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px;
}

.kpi b{
  display:block;
  color:var(--yellow);
  font-size:24px;
  margin-top:5px;
}

.tableWrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th,td{
  padding:9px;
  border:1px solid var(--line);
  font-size:12px;
  text-align:left;
}

th{
  background:var(--panel2);
  color:var(--yellow);
}

.status{
  padding:5px 9px;
  border-radius:999px;
  color:#fff;
  font-weight:800;
  display:inline-block;
}

.GREEN{background:var(--green)}
.YELLOW{background:var(--amber);color:#091827}
.RED{background:var(--red)}
.PURPLE{background:var(--purple)}
.GREY{background:var(--grey)}

.choiceRow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.choice{
  flex:1;
  min-width:90px;
  border:2px solid transparent;
  border-radius:10px;
  padding:13px;
  font-weight:900;
  color:#fff;
}

.choice.red{background:var(--red)}
.choice.yellow{background:var(--amber);color:#07182c}
.choice.green{background:var(--green)}

.choice.selected{
  border-color:white;
  box-shadow:0 0 0 3px var(--yellow);
}

.codeWrap{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.code{
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel3);
  color:var(--text);
  padding:8px 10px;
}

.code.selected{
  color:var(--yellow);
  border-color:var(--yellow);
}

.person{
  border:1px solid var(--line);
  background:var(--panel3);
  padding:10px;
  border-radius:8px;
  margin:5px 0;
}

.person.active{
  border-color:var(--yellow);
}

.chipGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:7px;
}

.chip{
  padding:10px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--panel3);
  color:var(--text);
}

.chip.on{
  background:var(--green);
  color:white;
}

.history{
  border-left:4px solid var(--yellow);
  padding:9px 11px;
  background:var(--panel3);
  border-radius:7px;
  margin:7px 0;
}

/* Camera */

#cameraOverlay{
  position:fixed;
  inset:0;
  background:#000;
  z-index:100;
}

#cameraVideo,
#cameraPhoto{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cameraTop{
  position:absolute;
  top:15px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:105;
}

.cameraBadge{
  background:rgba(4,18,31,.8);
  border:1px solid var(--yellow);
  color:var(--yellow);
  padding:8px 11px;
  border-radius:9px;
  font-weight:900;
}

#guide{
  position:absolute;
  top:22%;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  border-radius:12px;
  padding:10px 18px;
  font-weight:900;
  text-align:center;
  z-index:105;
}

.guideRed{border:2px solid #ff4f48;color:#ff4f48}
.guideYellow{border:2px solid var(--yellow);color:var(--yellow)}
.guideGreen{border:2px solid #3be277;color:#3be277}

#guideArrow{
  font-size:38px;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{opacity:.35}
}

#radialCanvas{
  position:absolute;
  left:0;
  bottom:160px;
  width:100%;
  height:150px;
  z-index:104;
}

.centerPointer{
  position:absolute;
  bottom:250px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:18px solid var(--yellow);
  z-index:106;
}

.liveBearing{
  position:absolute;
  bottom:168px;
  left:50%;
  transform:translateX(-50%);
  z-index:106;
  font-size:39px;
  color:var(--yellow);
  font-weight:900;
}

.weatherOverlay{
  position:absolute;
  bottom:90px;
  left:8px;
  right:8px;
  z-index:106;
  background:rgba(5,17,28,.82);
  padding:7px;
  border-radius:8px;
  text-align:center;
  font-size:11px;
}

.cameraButtons{
  position:absolute;
  bottom:15px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:25px;
  align-items:center;
  z-index:106;
}

.shutter{
  width:70px;
  height:70px;
  border-radius:50%;
  background:white;
  border:7px solid rgba(255,255,255,.45);
}

@media(max-width:760px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .brand{font-size:14px}
  main{padding:8px}
  header{align-items:flex-start}
}
</style>
</head>

<body>

<header id="header" class="hidden">
  <div>
    <div class="brand">AWO — AVIATION WEATHER OPERATIONS</div>
    <div id="userLine" class="small"></div>
  </div>

  <div class="actions">
    <button class="btn" id="themeBtn">◐</button>
    <button class="btn danger" id="logoutBtn">LOGOUT</button>
  </div>
</header>

<main>

<!-- LOGIN -->

<section id="login" class="loginWrap">
  <div class="loginCard">
    <div class="logo">AWO</div>
    <h1>AVIATION WEATHER OPERATIONS</h1>

    <div class="small center">
      Personal role-based weather and imagery platform
    </div>

    <label>User ID</label>
    <input id="loginId" placeholder="ARAOA">

    <label>Password</label>
    <input id="loginPass" type="password">

    <button class="btn primary" style="width:100%;margin-top:14px" id="loginBtn">
      LOGIN
    </button>

    <p id="loginError" style="color:#ff7770"></p>

    <div class="small center">
      Initial Administrator: ARAOA / 00007
    </div>
  </div>
</section>


<!-- MAIN APP -->

<section id="app" class="hidden">

  <div id="nav" class="nav"></div>

  <div id="content"></div>

</section>

</main>


<!-- CAMERA -->

<section id="cameraOverlay" class="hidden">

  <video id="cameraVideo" autoplay playsinline></video>
  <canvas id="captureCanvas" class="hidden"></canvas>
  <img id="cameraPhoto" class="hidden">

  <div class="cameraTop">
    <button class="btn danger" id="closeCamera">✕</button>

    <div class="cameraBadge" id="targetBearing">
      TARGET —
    </div>

    <button class="btn" id="referenceButton">
      REFERENCE
    </button>
  </div>

  <div id="guide" class="guideRed">
    <div id="guideText">TURN RIGHT</div>
    <div id="guideArrow">›››</div>
  </div>

  <div class="centerPointer"></div>

  <canvas id="radialCanvas" width="1000" height="150"></canvas>

  <div id="liveBearing" class="liveBearing">
    —°
  </div>

  <div id="cameraWeather" class="weatherOverlay"></div>

  <div class="cameraButtons">

    <button class="btn" id="overrideBtn">
      OVERRIDE
    </button>

    <button class="shutter" id="captureBtn"></button>

    <button class="btn" id="switchCamBtn">
      SWITCH
    </button>

  </div>

</section>


<script>
/* =====================================================
   DATABASE
===================================================== */

const DBKEY="AWO_HYBRID_DATABASE";

const WEATHER_CODES=[
"NIL","HZ","BR","FG",
"-DZ","DZ","+DZ",
"-RA","RA","+RA",
"-SN","SN","+SN",
"TS","SHRA","GR","GS"
];

function createDB(){

return {

 users:{
  ARAOA:{
   id:"ARAOA",
   password:"00007",
   role:"ADMIN",
   active:true,
   primary:true,
   helipads:[]
  }
 },

 helipads:{},

 observations:[],

 images:[],

 airreps:[],

 tasks:[],

 messages:[],

 audit:[]

};

}

let db;

try{
 db=JSON.parse(localStorage.getItem(DBKEY)) || createDB();
}catch{
 db=createDB();
}

function save(){
 localStorage.setItem(DBKEY,JSON.stringify(db));
}

function audit(action,detail){

 const user=currentUser();

 db.audit.unshift({
  time:new Date().toISOString(),
  user:user?user.id:"SYSTEM",
  action,
  detail
 });

 save();

}

function currentUser(){

 const id=localStorage.getItem("AWO_SESSION");

 return id ? db.users[id] : null;

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

 const id=document.getElementById("loginId").value.trim().toUpperCase();
 const pass=document.getElementById("loginPass").value;

 const u=db.users[id];

 if(!u || !u.active || u.password!==pass){

  document.getElementById("loginError").textContent=
  "Invalid User ID or password.";

  return;

 }

 localStorage.setItem("AWO_SESSION",id);

 audit("LOGIN","User logged in");

 route();

}


function logout(){

 audit("LOGOUT","User logged out");

 localStorage.removeItem("AWO_SESSION");

 route();

}


/* =====================================================
   ROUTING
===================================================== */

function route(){

 const user=currentUser();

 const login=document.getElementById("login");
 const app=document.getElementById("app");
 const header=document.getElementById("header");

 if(!user){

  login.classList.remove("hidden");
  app.classList.add("hidden");
  header.classList.add("hidden");

  return;

 }

 login.classList.add("hidden");
 app.classList.remove("hidden");
 header.classList.remove("hidden");

 document.getElementById("userLine").textContent=
 `${user.id} • ${user.role}${user.observerType?" / "+user.observerType:""}`;

 buildNav(user);

}


/* =====================================================
   NAVIGATION
===================================================== */

function buildNav(user){

 const nav=document.getElementById("nav");

 let tabs=[];

 if(user.role==="ADMIN"){

  tabs=[
   ["Dashboard","adminDashboard"],
   ["Helipads","adminHelipads"],
   ["Users","adminUsers"],
   ["Schedules","adminSchedules"],
   ["Messages","adminMessages"],
   ["Records","adminRecords"]
  ];

 }

 else if(user.role==="CAPTURER"){

  tabs=[
   ["Capture","capturer"],
   ["History","captureHistory"]
  ];

 }

 else if(user.role==="OBSERVER" &&
         user.observerType==="OUTSTATION"){

  tabs=[
   ["Weather","outstation"],
   ["Camera","outCamera"],
   ["History","outHistory"]
  ];

 }

 else if(user.role==="OBSERVER"){

  tabs=[
   ["My Helipads","instation"],
   ["Latest Updates","inHistory"]
  ];

 }

 else if(user.role==="AVIATOR"){

  tabs=[
   ["Latest Weather","aviator"],
   ["AIRREP","airrep"],
   ["Alerts","aviatorAlerts"]
  ];

 }

 nav.innerHTML="";

 tabs.forEach((t,i)=>{

  const b=document.createElement("button");

  b.className="btn";

  b.textContent=t[0];

  b.onclick=()=>showPage(t[1]);

  nav.appendChild(b);

 });

 showPage(tabs[0][1]);

}


function showPage(page){

 if(page==="adminDashboard") renderAdminDashboard();

 if(page==="adminHelipads") renderAdminHelipads();

 if(page==="adminUsers") renderAdminUsers();

 if(page==="adminSchedules") renderAdminSchedules();

 if(page==="adminMessages") renderAdminMessages();

 if(page==="adminRecords") renderAdminRecords();

 if(page==="capturer") renderCapturer();

 if(page==="captureHistory") renderCaptureHistory();

 if(page==="outstation") renderOutstation();

 if(page==="outCamera") renderOutCamera();

 if(page==="outHistory") renderOutHistory();

 if(page==="instation") renderInstation();

 if(page==="inHistory") renderInstationHistory();

 if(page==="aviator") renderAviator();

 if(page==="airrep") renderAIRREP();

 if(page==="aviatorAlerts") renderAviatorAlerts();

}


/* =====================================================
   STATUS ENGINE
===================================================== */

function latestObservation(helipad,source){

 let a=db.observations
  .filter(o=>o.helipad===helipad);

 if(source){
  a=a.filter(o=>o.source===source);
 }

 return a.sort(
  (a,b)=>new Date(b.time)-new Date(a.time)
 )[0] || null;

}


function latestImage(helipad){

 return db.images
 .filter(i=>i.helipad===helipad)
 .sort(
  (a,b)=>new Date(b.time)-new Date(a.time)
 )[0] || null;

}


function operationalObservation(h){

 if(h.mode==="OUTSTATION")
  return latestObservation(h.id,"OUT");

 return latestObservation(h.id,"IN");

}


function statusFor(h){

 const o=operationalObservation(h);
 const img=latestImage(h.id);

 if(!o){

  if(img) return "PURPLE";

  return "GREY";

 }

 const age=
 (Date.now()-new Date(o.time).getTime())/60000;

 if(age > Number(h.validity||30)){

  return img ? "PURPLE" : "GREY";

 }

 return o.systemColour || o.observerColour || "GREEN";

}


function calculateColour(h,data){

 if(h.autoColour==="OFF")
   return data.observerColour;

 const v=Number(data.visibility);
 const wx=data.weather||[];

 if(
   v < Number(h.redVis||1000) ||
   data.htStatus==="HTNV" ||
   wx.includes("TS") ||
   wx.includes("+RA") ||
   wx.includes("GR") ||
   wx.includes("GS")
 ){
  return "RED";
 }

 if(
   v < Number(h.yellowVis||3000) ||
   data.htStatus==="HTPV" ||
   wx.includes("RA") ||
   wx.includes("FG") ||
   wx.includes("BR")
 ){
  return "YELLOW";
 }

 return "GREEN";

}


/* =====================================================
   ADMIN DASHBOARD
===================================================== */

function renderAdminDashboard(){

 const content=document.getElementById("content");

 const hs=Object.values(db.helipads)
 .filter(h=>h.active!==false);

 let counts={
  GREEN:0,
  YELLOW:0,
  RED:0,
  PURPLE:0,
  GREY:0
 };

 hs.forEach(h=>counts[statusFor(h)]++);

 content.innerHTML=`

 <div class="grid g4">

  <div class="kpi">
   <span class="small">HELIPADS</span>
   <b>${hs.length}</b>
  </div>

  <div class="kpi">
   <span class="small">ACTIVE USERS</span>
   <b>${Object.values(db.users).filter(u=>u.active).length}</b>
  </div>

  <div class="kpi">
   <span class="small">OBSERVATIONS</span>
   <b>${db.observations.length}</b>
  </div>

  <div class="kpi">
   <span class="small">IMAGES</span>
   <b>${db.images.length}</b>
  </div>

 </div>

 <div class="card">

  <div class="cardTitle">
   CURRENT STATUS
  </div>

  <div class="cardBody grid g4">

   ${["GREEN","YELLOW","RED","PURPLE","GREY"]
   .map(c=>
   `<div class="kpi ${c}">
      ${c}<b>${counts[c]}</b>
    </div>`)
   .join("")}

  </div>

 </div>

 <div class="card">

  <div class="cardTitle">
   HELIPAD STATUS
  </div>

  <div class="cardBody">

   <div class="tableWrap">

    <table>

     <tr>
      <th>Helipad</th>
      <th>Status</th>
      <th>Weather Source</th>
      <th>Latest Image</th>
     </tr>

     ${
      hs.map(h=>{

       const o=operationalObservation(h);
       const img=latestImage(h.id);

       return `
       <tr>
        <td>${h.id}</td>
        <td>
         <span class="status ${statusFor(h)}">
          ${statusFor(h)}
         </span>
        </td>
        <td>${o?o.source:"—"}</td>
        <td>${img?new Date(img.time).toLocaleTimeString():"NO IMAGE"}</td>
       </tr>`;
      }).join("")
     }

    </table>

   </div>

  </div>

 </div>
 `;

}


/* =====================================================
   HELIPAD ADMINISTRATION
===================================================== */

function renderAdminHelipads(){

 const content=document.getElementById("content");

 content.innerHTML=`

 <div class="card">

  <div class="cardTitle">
   CREATE / EDIT HELIPAD
  </div>

  <div class="cardBody grid g2">

   <div>

    <label>Helipad Name / ID</label>
    <input id="hName">

    <label>Operating Mode</label>

    <select id="hMode">
     <option value="OUTSTATION">
      Outstation Observer
     </option>

     <option value="CAP_IN">
      Capturer + Instation Observer
     </option>
    </select>

    <label>Active Views</label>

    <select id="hViews">
     <option>1</option>
     <option>2</option>
     <option>3</option>
     <option selected>4</option>
    </select>

   </div>

   <div>

    <label>Weather Validity (minutes)</label>
    <input id="hValidity" value="30" type="number">

    <label>Automatic Colour</label>

    <select id="hAuto">
     <option>ON</option>
     <option>OFF</option>
    </select>

    <label>RED below visibility (m)</label>
    <input id="hRed" value="1000" type="number">

    <label>YELLOW below visibility (m)</label>
    <input id="hYellow" value="3000" type="number">

   </div>

  </div>

  <div class="cardBody">

   <button class="btn primary"
   onclick="saveHelipad()">

    SAVE HELIPAD

   </button>

  </div>

 </div>

 <div class="card">

  <div class="cardTitle">
   HELIPADS
  </div>

  <div class="cardBody">

   <div class="tableWrap">

    <table>

     <tr>
      <th>Helipad</th>
      <th>Mode</th>
      <th>Status</th>
      <th>Views</th>
      <th>Action</th>
     </tr>

     ${
      Object.values(db.helipads)
      .map(h=>`

       <tr>

        <td>${h.id}</td>

        <td>${h.mode}</td>

        <td>
         <span class="status ${statusFor(h)}">
          ${statusFor(h)}
         </span>
        </td>

        <td>${h.views}</td>

        <td>

         <button class="btn"
          onclick="configureViews('${h.id}')">

          REFERENCE IMAGES

         </button>

        </td>

       </tr>

      `).join("")
     }
