<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#07182c"
>

<link
  rel="manifest"
  href="manifest.webmanifest"
>

<title>
AWO — Aviation Weather Operations
</title>


<style>

:root{

  --bg:#061527;

  --panel:#0b2746;

  --panel2:#103759;

  --panel3:#081e36;

  --text:#f6f9fc;

  --muted:#afc0d1;

  --line:#315473;

  --yellow:#ffd21f;

  --blue:#2678d9;

  --green:#159447;

  --amber:#d4a10b;

  --red:#c83232;

  --purple:#8149aa;

  --grey:#65707c;

  --input:#061a2f;

}


*{

  box-sizing:border-box;

}


body{

  margin:0;

  font-family:
  Arial,
  sans-serif;

  background:
  var(--bg);

  color:
  var(--text);

}


button,
input,
select,
textarea{

  font:inherit;

}


button{

  cursor:pointer;

}


.hidden{

  display:none !important;

}


.small{

  font-size:12px;

  color:
  var(--muted);

}


.center{

  text-align:center;

}


/* =========================
   HEADER
========================= */

header{

  position:sticky;

  top:0;

  z-index:30;

  display:flex;

  justify-content:
  space-between;

  align-items:center;

  gap:10px;

  padding:
  10px 14px;

  background:
  var(--panel);

  border-bottom:
  2px solid
  var(--yellow);

}


.brand{

  color:
  var(--yellow);

  font-weight:900;

}


.actions{

  display:flex;

  gap:7px;

  flex-wrap:wrap;

}


/* =========================
   BUTTONS
========================= */

.btn{

  border:
  1px solid
  var(--line);

  border-radius:9px;

  padding:
  10px 12px;

  background:
  var(--panel2);

  color:
  var(--text);

  min-height:42px;

}


.btn.primary{

  background:
  var(--blue);

  border-color:
  var(--blue);

  color:white;

  font-weight:800;

}


.btn.success{

  background:
  var(--green);

  border-color:
  var(--green);

  color:white;

}


.btn.danger{

  background:
  var(--red);

  border-color:
  var(--red);

  color:white;

}


/* =========================
   MAIN
========================= */

main{

  max-width:1280px;

  margin:auto;

  padding:12px;

}


/* =========================
   LOGIN
========================= */

.loginWrap{

  min-height:100vh;

  display:grid;

  place-items:center;

}


.loginCard{

  width:
  min(
    440px,
    95vw
  );

  background:
  var(--panel);

  border:
  1px solid
  var(--line);

  border-radius:16px;

  padding:24px;

}


.logo{

  width:84px;

  height:84px;

  border:
  3px solid
  var(--yellow);

  border-radius:50%;

  display:grid;

  place-items:center;

  margin:auto;

  color:
  var(--yellow);

  font-weight:900;

  font-size:24px;

}


.loginCard h1{

  text-align:center;

  color:
  var(--yellow);

  font-size:24px;

}


/* =========================
   FORMS
========================= */

label{

  display:block;

  color:
  var(--yellow);

  font-size:12px;

  font-weight:800;

  margin:
  10px 0 5px;

}


input,
select,
textarea{

  width:100%;

  min-height:44px;

  border:
  1px solid
  var(--line);

  border-radius:8px;

  background:
  var(--input);

  color:
  var(--text);

  padding:10px;

}


textarea{

  min-height:88px;

}


/* =========================
   NAVIGATION
========================= */

.nav{

  display:flex;

  gap:7px;

  flex-wrap:wrap;

  margin-bottom:12px;

}


.nav .active{

  border-color:
  var(--yellow);

  color:
  var(--yellow);

}


/* =========================
   CARDS
========================= */

.card{

  background:
  var(--panel);

  border:
  1px solid
  var(--line);

  border-radius:13px;

  margin-bottom:12px;

  overflow:hidden;

}


.cardTitle{

  padding:
  11px 13px;

  background:
  var(--panel2);

  color:
  var(--yellow);

  font-weight:900;

}


.cardBody{

  padding:13px;

}


/* =========================
   GRIDS
========================= */

.grid{

  display:grid;

  gap:10px;

}


.g2{

  grid-template-columns:
  repeat(
    2,
    minmax(
      0,
      1fr
    )
  );

}


.g3{

  grid-template-columns:
  repeat(
    3,
    minmax(
      0,
      1fr
    )
  );

}


.g4{

  grid-template-columns:
  repeat(
    4,
    minmax(
      0,
      1fr
    )
  );

}


/* =========================
   KPI
========================= */

.kpi{

  background:
  var(--panel3);

  border:
  1px solid
  var(--line);

  border-radius:10px;

  padding:13px;

}


.kpi b{

  display:block;

  color:
  var(--yellow);

  font-size:25px;

  margin-top:5px;

}


/* =========================
   TABLE
========================= */

.tableWrap{

  overflow:auto;

}


table{

  width:100%;

  border-collapse:
  collapse;

  min-width:760px;

}


th,
td{

  padding:9px;

  border:
  1px solid
  var(--line);

  font-size:12px;

  text-align:left;

}


th{

  background:
  var(--panel2);

  color:
  var(--yellow);

}


/* =========================
   COLOURS
========================= */

.status{

  display:inline-block;

  padding:
  5px 9px;

  border-radius:999px;

  color:white;

  font-weight:800;

}


.GREEN{

  background:
  var(--green);

}


.YELLOW{

  background:
  var(--amber);

  color:#07182c;

}


.RED{

  background:
  var(--red);

}


.PURPLE{

  background:
  var(--purple);

}


.GREY{

  background:
  var(--grey);

}


/* =========================
   PERSONNEL
========================= */

.person{

  border:
  1px solid
  var(--line);

  background:
  var(--panel3);

  padding:10px;

  border-radius:8px;

  margin:
  5px 0;

}


.person.active{

  border-color:
  var(--yellow);

}


.chipGrid{

  display:grid;

  grid-template-columns:
  repeat(
    auto-fill,
    minmax(
      105px,
      1fr
    )
  );

  gap:7px;

}


.chip{

  padding:10px;

  border:
  1px solid
  var(--line);

  border-radius:8px;

  background:
  var(--panel3);

  color:
  var(--text);

}


.chip.on{

  background:
  var(--green);

  color:white;

}


.history{

  border-left:
  4px solid
  var(--yellow);

  padding:
  9px 11px;

  background:
  var(--panel3);

  border-radius:7px;

  margin:
  7px 0;

}


/* =========================
   GUIDED CAMERA
========================= */

.cameraShell{

  position:relative;

  width:100%;

  max-width:700px;

  margin:auto;

  overflow:hidden;

  border-radius:14px;

  border:
  2px solid
  var(--line);

  background:#000;

}


.cameraShell.align-red{

  border-color:
  var(--red);

}


.cameraShell.align-yellow{

  border-color:
  var(--amber);

}


.cameraShell.align-green{

  border-color:
  var(--green);

  box-shadow:
  0 0 18px
  rgba(
    0,
    255,
    100,
    .35
  );

}


#cameraVideo{

  display:block;

  width:100%;

  min-height:420px;

  object-fit:cover;

  background:#000;

}


.cameraOverlay{

  position:absolute;

  inset:0;

  pointer-events:none;

}


.compassDial{

  position:absolute;

  left:50%;

  top:50%;

  transform:
  translate(
    -50%,
    -50%
  );

  width:230px;

  height:230px;

  border:
  3px solid
  var(--yellow);

  border-radius:50%;

  background:
  rgba(
    0,
    0,
    0,
    .15
  );

}


.compassDial::before{

  content:"";

  position:absolute;

  left:50%;

  top:-12px;

  transform:
  translateX(
    -50%
  );

  border-left:
  10px solid
  transparent;

  border-right:
  10px solid
  transparent;

  border-bottom:
  20px solid
  var(--yellow);

}


.compassCentre{

  position:absolute;

  left:50%;

  top:50%;

  transform:
  translate(
    -50%,
    -50%
  );

  width:12px;

  height:12px;

  border-radius:50%;

  background:
  var(--yellow);

}


.compassNorth{

  position:absolute;

  top:8px;

  left:50%;

  transform:
  translateX(
    -50%
  );

  color:
  var(--yellow);

  font-weight:900;

}


.compassSouth{

  position:absolute;

  bottom:8px;

  left:50%;

  transform:
  translateX(
    -50%
  );

  color:white;

  font-weight:800;

}


.compassEast{

  position:absolute;

  right:10px;

  top:50%;

  transform:
  translateY(
    -50%
  );

  color:white;

  font-weight:800;

}


.compassWest{

  position:absolute;

  left:10px;

  top:50%;

  transform:
  translateY(
    -50%
  );

  color:white;

  font-weight:800;

}


.cameraBearing{

  position:absolute;

  top:12px;

  left:50%;

  transform:
  translateX(
    -50%
  );

  background:
  rgba(
    0,
    0,
    0,
    .72
  );

  padding:
  8px 14px;

  border-radius:20px;

  color:
  var(--yellow);

  font-size:22px;

  font-weight:900;

}


.cameraGuidance{

  position:absolute;

  bottom:75px;

  left:50%;

  transform:
  translateX(
    -50%
  );

  min-width:220px;

  text-align:center;

  background:
  rgba(
    0,
    0,
    0,
    .72
  );

  padding:
  10px 15px;

  border-radius:10px;

  font-size:20px;

  font-weight:900;

}


.cameraInfo{

  position:absolute;

  bottom:10px;

  left:10px;

  right:10px;

  background:
  rgba(
    0,
    0,
    0,
    .72
  );

  padding:8px;

  border-radius:8px;

  color:white;

  font-size:12px;

}


.referenceMini{

  width:100%;

  max-height:220px;

  object-fit:cover;

  border-radius:10px;

  border:
  1px solid
  var(--line);

}


.captureButton{

  width:74px;

  height:74px;

  border-radius:50%;

  border:
  6px solid
  white;

  background:
  var(--red);

  display:block;

  margin:
  14px auto;

}


.captureButton.ready{

  background:
  var(--green);

}


.cameraArrow{

  font-size:30px;

  color:
  var(--yellow);

}


/* =========================
   MOBILE
========================= */

@media(
max-width:760px
){

  .g2,
  .g3,
  .g4{

    grid-template-columns:
    1fr;

  }


  .brand{

    font-size:14px;

  }


  main{

    padding:8px;

  }


  header{

    align-items:
    flex-start;

  }

}

</style>

</head>


<body>


<header
id="header"
class="hidden"
>

<div>

<div class="brand">

AWO — AVIATION WEATHER OPERATIONS

</div>


<div
id="userLine"
class="small"
></div>

</div>


<div class="actions">

<button
class="btn danger"
id="logoutBtn"
>

LOGOUT

</button>

</div>

</header>



<main>


<section
id="login"
class="loginWrap"
>


<div class="loginCard">


<div class="logo">

AWO

</div>


<h1>

AVIATION WEATHER OPERATIONS

</h1>


<div
class="small center"
>

Personal role-based weather,
imagery and AIRREP platform

</div>


<label>

User ID

</label>


<input
id="loginId"
autocomplete="username"
placeholder="ARAOA"
>


<label>

Password

</label>


<input
id="loginPass"
type="password"
autocomplete="current-password"
>


<button
class="btn primary"
style="
width:100%;
margin-top:14px;
"
id="loginBtn"
>

LOGIN

</button>


<p
id="loginError"
style="
color:#ff7770
"
></p>


<div
class="small center"
>

Initial Administrator:

<b>

ARAOA / 00007

</b>

</div>


</div>

</section>



<section
id="app"
class="hidden"
>


<div
id="nav"
class="nav"
></div>


<div
id="content"
></div>


</section>


</main>



<script>

"use strict";


/* =========================
   DATABASE
========================= */

const DB_KEY =
"AWO_HYBRID_DATABASE";


const SESSION_KEY =
"AWO_SESSION";


const $ =
id =>
document.getElementById(
id
);



function createDatabase(){

return {

users:{},

helipads:{},

observations:[],

images:[],

airreps:[],

tasks:[],

messages:[],

audit:[],

requests:[],

aviatorPrefs:{}

};

}



function readJSON(
value
){

try{

return value
?
JSON.parse(
value
)
:
null;

}

catch(
error
){

return null;

}

}



let db =

readJSON(

localStorage.getItem(
DB_KEY
)

);



if(
!db
){

db =
createDatabase();

}



if(
!db.users
){

db.users={};

}


if(
!db.helipads
){

db.helipads={};

}



[
"observations",
"images",
"airreps",
"tasks",
"messages",
"audit",
"requests"
]

.forEach(
key=>{

if(
!Array.isArray(
db[key]
)
){

db[key]=[];

}

}
);



if(
!db.aviatorPrefs
){

db.aviatorPrefs={};

}



/* =========================
   PRIMARY ADMINISTRATOR
========================= */

const existingAdmin =
db.users.ARAOA || {};


db.users.ARAOA={

...existingAdmin,

id:"ARAOA",

password:"00007",

role:"ADMIN",

observerType:null,

active:true,

primary:true,

helipads:
Array.isArray(
existingAdmin.helipads
)
?
existingAdmin.helipads
:
[]

};



function saveDatabase(){

localStorage.setItem(

DB_KEY,

JSON.stringify(
db
)

);

}


saveDatabase();



function currentUser(){

const id =

localStorage.getItem(
SESSION_KEY
);


return (

id
&&
db.users[id]

)

?

db.users[id]

:

null;

}



function addAudit(
action,
detail
){

const user =
currentUser();


db.audit.unshift({

time:
new Date()
.toISOString(),

user:
user
?
user.id
:
"SYSTEM",

action,

detail

});


saveDatabase();

}



function safe(
value
){

return String(
value ?? ""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
);

}



/* =========================
   LOGIN
========================= */

function login(){

const id =

$("loginId")
.value
.trim()
.toUpperCase();


const password =

$("loginPass")
.value;


const user =
db.users[id];


if(

!user

||

user.active === false

||

String(
user.password
)
!==

String(
password
)

){

$("loginError")
.textContent =

"Invalid User ID or password.";


return;

}


$("loginError")
.textContent="";


localStorage.setItem(

SESSION_KEY,

id

);


addAudit(

"LOGIN",

"User logged in"

);


route();

}



function logout(){

if(
currentUser()
){

addAudit(

"LOGOUT",

"User logged out"

);

}


localStorage.removeItem(
SESSION_KEY
);


route();

}



/* =========================
   ROUTING
========================= */

function route(){

const user =
currentUser();


if(
!user
){

$("login")
.classList
.remove(
"hidden"
);


$("app")
.classList
.add(
"hidden"
);


$("header")
.classList
.add(
"hidden"
);


return;

}


$("login")
.classList
.add(
"hidden"
);


$("app")
.classList
.remove(
"hidden"
);


$("header")
.classList
.remove(
"hidden"
);


$("userLine")
.textContent =

user.id

+

" • "

+

user.role

+

(
user.observerType
?
" / " +
user.observerType
:
""
);


buildNavigation(
user
);

}



/* =========================
   NAVIGATION
========================= */

function buildNavigation(
user
){

let tabs=[];


if(
user.role ===
"ADMIN"
){

tabs=[

[
"Dashboard",
renderAdminDashboard
],

[
"Helipads",
renderHelipads
],

[
"Users",
renderUsers
],

[
"Schedules",
renderSchedules
],

[
"Records",
renderRecords
]

];

}

else{

tabs=[

[
"Home",
renderRoleHome
]

];


if(
user.role ===
"CAPTURER"
){

tabs.push([

"Camera",

renderGuidedCamera

]);

}


if(

user.role ===
"OBSERVER"

&&

user.observerType ===
"OUTSTATION"

){

tabs.push([

"Camera",

renderGuidedCamera

]);

}

}


const nav =
$("nav");


nav.innerHTML="";


tabs.forEach(
(
tab,
index
)=>{

const button =

document.createElement(
"button"
);


button.className =

"btn"

+

(
index === 0
?
" active"
:
""
);


button.textContent =
tab[0];


button.onclick=()=>{

[
...nav.children
]

.forEach(
element =>
element
.classList
.remove(
"active"
)
);


button
.classList
.add(
"active"
);


tab[1]();

};


nav.appendChild(
button
);

}
);


if(
tabs[0]
){

tabs[0][1]();

}

}



/* =========================
   HELIPAD STATUS
========================= */

function getHelipadStatus(
helipad
){

if(
!helipad
){

return "GREY";

}


const observations =

db.observations

.filter(
item =>

item.helipad ===
helipad.id

||

item.helipadId ===
helipad.id

)

.sort(
(
a,
b
)=>

new Date(
b.time ||
b.observedAt ||
0
)

-

new Date(
a.time ||
a.observedAt ||
0
)

);


const latest =
observations[0];


const image =

db.images.find(
item =>

item.helipad ===
helipad.id

||

item.helipadId ===
helipad.id

);


if(
!latest
){

return image
?
"PURPLE"
:
"GREY";

}


return (

latest.systemColour

||

latest.observerColour

||

"GREEN"

);

}



/* =========================
   ADMIN DASHBOARD
========================= */

function renderAdminDashboard(){

const helipads =

Object.values(
db.helipads
);


const activeUsers =

Object.values(
db.users
)

.filter(
user =>
user.active !== false
);


const counts={

GREEN:0,

YELLOW:0,

RED:0,

PURPLE:0,

GREY:0

};


helipads.forEach(
helipad=>{

const status =

getHelipadStatus(
helipad
);


if(
counts[status] !==
undefined
){

counts[status]++;

}

}
);


$("content")
.innerHTML = `


<div class="grid g4">


<div class="kpi">

HELIPADS

<b>

${helipads.length}

</b>

</div>


<div class="kpi">

ACTIVE USERS

<b>

${activeUsers.length}

</b>

</div>


<div class="kpi">

OBSERVATIONS

<b>

${db.observations.length}

</b>

</div>


<div class="kpi">

IMAGES

<b>

${db.images.length}

</b>

</div>


</div>



<div class="card">


<div class="cardTitle">

CURRENT WEATHER STATUS

</div>


<div class="cardBody">


<div class="grid g4">


<div class="kpi GREEN">

GREEN

<b>

${counts.GREEN}

</b>

</div>


<div class="kpi YELLOW">

YELLOW

<b>

${counts.YELLOW}

</b>

</div>


<div class="kpi RED">

RED

<b>

${counts.RED}

</b>

</div>


<div class="kpi PURPLE">

PURPLE

<b>

${counts.PURPLE}

</b>

</div>


<div class="kpi GREY">

GREY

<b>

${counts.GREY}

</b>

</div>


</div>


</div>

</div>



<div class="card">


<div class="cardTitle">

HELIPAD OVERVIEW

</div>


<div class="cardBody tableWrap">


<table>


<tr>

<th>
HELIPAD
</th>

<th>
STATUS
</th>

<th>
MODE
</th>

<th>
VIEWS
</th>

<th>
ACTIVE
</th>

</tr>


${

helipads.map(
helipad=>{

const status =

getHelipadStatus(
helipad
);


return `

<tr>

<td>

<b>

${safe(
helipad.id
)}

</b>

</td>

<td>

<span
class="status ${status}"
>

${status}

</span>

</td>

<td>

${safe(
helipad.mode ||
"—"
)}

</td>

<td>

${safe(
helipad.views ||
4
)}
