<style>
:root{--bg:#061527;--panel:#0b2746;--panel2:#103759;--panel3:#081e36;--text:#f6f9fc;--muted:#afc0d1;--line:#315473;--yellow:#ffd21f;--blue:#2678d9;--green:#159447;--amber:#d4a10b;--red:#c83232;--purple:#8149aa;--grey:#65707c;--input:#061a2f}
[data-theme="light"]{--bg:#eef3f8;--panel:#fff;--panel2:#e7edf4;--panel3:#f5f8fb;--text:#10243a;--muted:#5b6b7b;--line:#bcc8d4;--yellow:#9b7200;--input:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}.center{text-align:center}
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--yellow)}.brand{color:var(--yellow);font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel2);color:var(--text);min-height:42px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:800}.btn.success{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn.purple{background:var(--purple);border-color:var(--purple);color:#fff}
main{max-width:1280px;margin:auto;padding:12px}.loginWrap{min-height:100vh;display:grid;place-items:center}.loginCard{width:min(440px,95vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}.logo{width:84px;height:84px;border:3px solid var(--yellow);border-radius:50%;display:grid;place-items:center;margin:auto;color:var(--yellow);font-weight:900;font-size:24px}.loginCard h1{text-align:center;color:var(--yellow);font-size:24px}
label{display:block;color:var(--yellow);font-size:12px;font-weight:800;margin:10px 0 5px}input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--text);padding:10px}textarea{min-height:88px}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.nav .active{border-color:var(--yellow);color:var(--yellow)}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden}.cardTitle{padding:11px 13px;background:var(--panel2);color:var(--yellow);font-weight:900}.cardBody{padding:13px}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:13px}.kpi b{display:block;color:var(--yellow);font-size:25px;margin-top:5px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border:1px solid var(--line);font-size:12px;text-align:left}th{background:var(--panel2);color:var(--yellow)}
.status{display:inline-block;padding:5px 9px;border-radius:999px;color:#fff;font-weight:800}.GREEN{background:var(--green)}.YELLOW{background:var(--amber);color:#07182c}.RED{background:var(--red)}.PURPLE{background:var(--purple)}.GREY{background:var(--grey)}
.choiceRow,.codeWrap{display:flex;gap:7px;flex-wrap:wrap}.choice,.code{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--panel3);color:var(--text)}.choice.red{background:var(--red);color:#fff}.choice.yellow{background:var(--amber);color:#07182c}.choice.green{background:var(--green);color:#fff}.choice.selected,.code.selected{outline:2px solid var(--yellow)}
.person{border:1px solid var(--line);background:var(--panel3);padding:10px;border-radius:8px;margin:5px 0}.person.active{border-color:var(--yellow)}.chipGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:7px}.chip{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel3);color:var(--text)}.chip.on{background:var(--green);color:#fff}.history{border-left:4px solid var(--yellow);padding:9px 11px;background:var(--panel3);border-radius:7px;margin:7px 0}.imgGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.imgCard{border:1px solid var(--line);background:var(--panel3);border-radius:10px;padding:8px}.imgCard img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:7px}
#cameraOverlay{position:fixed;inset:0;background:#000;z-index:100}#cameraVideo{width:100%;height:100%;object-fit:cover}.cameraTop{position:absolute;top:15px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:105}.cameraBadge{background:rgba(4,18,31,.82);border:1px solid var(--yellow);color:var(--yellow);padding:8px 11px;border-radius:9px;font-weight:900}
#guide{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);border-radius:12px;padding:10px 18px;font-weight:900;text-align:center;z-index:105}.guideRed{border:2px solid #ff4f48;color:#ff4f48}.guideYellow{border:2px solid var(--yellow);color:var(--yellow)}.guideGreen{border:2px solid #3be277;color:#3be277}#guideArrow{font-size:38px;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}
#radialCanvas{position:absolute;left:3%;right:3%;bottom:178px;width:94%;height:170px;z-index:104;background:rgba(0,12,24,.18);border-radius:18px;pointer-events:none}.centerPointer{position:absolute;bottom:326px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--yellow);z-index:106;filter:drop-shadow(0 0 5px #000)}.liveBearing{position:absolute;bottom:190px;left:50%;transform:translateX(-50%);z-index:106;font-size:42px;color:var(--yellow);font-weight:900;text-shadow:0 2px 5px #000}.weatherOverlay{position:absolute;bottom:112px;left:8px;right:8px;z-index:106;background:rgba(5,17,28,.82);padding:7px;border-radius:8px;text-align:center;font-size:11px}.cameraButtons{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:34px;align-items:center;z-index:106}.shutter{width:92px;height:92px;border-radius:50%;background:white;border:8px solid rgba(255,255,255,.48);box-shadow:0 0 0 2px rgba(0,0,0,.35)}#overrideBtn{font-size:17px;font-weight:900;padding:13px 18px;min-height:48px;border:1px solid var(--yellow);color:var(--yellow);background:rgba(5,17,28,.82)}#overrideBtn.overrideActive{background:#7a5210;color:#fff;border-color:#ffd21f}.overridePanel{position:absolute;inset:0;z-index:120;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;padding:18px}.overrideCard{width:min(92vw,430px);background:#071b2d;border:1px solid #ffd21f;border-radius:16px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.55)}.overrideTitle{font-size:20px;font-weight:900;color:#ffd21f;text-align:center;margin-bottom:14px}.bearingAdjuster{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:7px;align-items:center;margin:10px 0}.bearingAdjuster button{min-height:44px;font-weight:900}.overrideBearingValue{font-size:30px;font-weight:900;color:#ffd21f;text-align:center;min-width:88px}.overrideActions{display:flex;gap:10px;margin-top:14px}.overrideActions button{flex:1;min-height:46px;font-weight:900}.overrideHint{font-size:12px;color:#b9c8d6;margin-top:8px;text-align:center}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.brand{font-size:14px}main{padding:8px}header{align-items:flex-start}}
</style>

<body>
<header id="header" class="hidden"><div><div class="brand">AWO — AVIATION WEATHER OPERATIONS</div><div id="userLine" class="small"></div></div><div class="actions"><button class="btn" id="themeBtn">◐</button><button class="btn danger" id="logoutBtn">LOGOUT</button></div></header>
<main>
<section id="login" class="loginWrap"><div class="loginCard"><div class="logo">AWO</div><h1>AVIATION WEATHER OPERATIONS</h1><div class="small center">Personal role-based weather, imagery and AIRREP platform</div><label>User ID</label><input id="loginId" autocomplete="username" placeholder="ARAOA"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:14px" id="loginBtn">LOGIN</button><p id="loginError" style="color:#ff7770"></p><div class="small center">Initial Administrator: ARAOA / 00007</div></div></section>

</main>

<section id="cameraOverlay" class="hidden">
<video id="cameraVideo" autoplay playsinline></video>
<canvas id="captureCanvas" class="hidden"></canvas>
<div class="cameraTop"><button class="btn danger" id="closeCamera">✕</button><div class="cameraBadge" id="targetBearing">TARGET —</div><button class="btn" id="referenceButton">REFERENCE</button></div>

<div class="cameraButtons"><button class="btn" id="overrideBtn">OVERRIDE</button><button class="shutter" id="captureBtn" aria-label="Capture image"></button></div>

      <button class="btn" id="bearingMinus10">−10°</button>

    <input id="overrideBearingInput" type="number" min="0" max="359" inputmode="numeric" placeholder="Enter bearing 0–359°">
    <label>Reason for override</label>
    <select id="overrideReason">
      <option value="">Select reason</option>
      <option value="COMPASS_UNAVAILABLE">Compass unavailable</option>
      <option value="COMPASS_INACCURATE">Compass inaccurate</option>

      <option value="OTHER">Other</option>

    </div>

</section>

<script>
/* AWO CAMERA HOTFIX V5.1 - rear camera only, robust compass, visible radial, in-camera override */
"use strict";
const DBKEY="AWO_HYBRID_DATABASE", OLD_DBKEY="awo_v2_foundation_db", SESSIONKEY="AWO_SESSION";
const WEATHER_CODES=["NIL","HZ","BR","FG","-DZ","DZ","+DZ","-RA","RA","+RA","-SN","SN","+SN","TS","SHRA","GR","GS"];
const $=id=>document.getElementById(id);
function emptyDB(){return {users:{},helipads:{},observations:[],images:[],airreps:[],tasks:[],messages:[],audit:[],requests:[],aviatorPrefs:{}}}
function parse(v){try{return v?JSON.parse(v):null}catch{return null}}
function normalize(d){d=(d&&typeof d==="object")?d:emptyDB();d.users=(d.users&&typeof d.users==="object"&&!Array.isArray(d.users))?d.users:{};d.helipads=(d.helipads&&typeof d.helipads==="object"&&!Array.isArray(d.helipads))?d.helipads:{};for(const k of ["observations","images","airreps","tasks","messages","audit","requests"])if(!Array.isArray(d[k]))d[k]=[];if(!d.aviatorPrefs||typeof d.aviatorPrefs!=="object")d.aviatorPrefs={};Object.values(d.users).forEach(u=>{if(!Array.isArray(u.helipads))u.helipads=[];if(u.active===undefined)u.active=true});Object.values(d.helipads).forEach(h=>{if(h.active===undefined)h.active=true;if(h.validity==null)h.validity=h.weatherValidityMinutes||30;if(!h.autoColour)h.autoColour="ON";if(h.redVis==null)h.redVis=1000;if(h.yellowVis==null)h.yellowVis=3000;if(h.views==null)h.views=4;if(!Array.isArray(h.viewConfig)){h.viewConfig=Array.from({length:Number(h.views||4)},(_,i)=>({id:"V"+(i+1),label:"VIEW "+(i+1),bearing:(i*90)%360,tolerance:10,reference:null}))}});return d}
let db=parse(localStorage.getItem(DBKEY));
if(!db){const old=parse(localStorage.getItem(OLD_DBKEY));db=old?{users:old.users||{},helipads:old.helipads||{},observations:old.observations||[],images:old.images||[],airreps:old.airreps||[],tasks:old.tasks||[],messages:old.messages||[],audit:old.audit||[],requests:old.requests||[],aviatorPrefs:old.aviatorPrefs||{}}:emptyDB()}
db=normalize(db);
const oldAdmin=db.users.ARAOA||{};
db.users.ARAOA={...oldAdmin,id:"ARAOA",password:"00007",role:"ADMIN",observerType:null,active:true,primary:true,helipads:Array.isArray(oldAdmin.helipads)?oldAdmin.helipads:[]};
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(db));return true}catch(e){alert("Local storage is full/unavailable. Export or clear old image history.");return false}}
save();
function currentUser(){const id=localStorage.getItem(SESSIONKEY);return id&&db.users[id]?db.users[id]:null}
function audit(action,detail){const u=currentUser();db.audit.unshift({time:new Date().toISOString(),user:u?u.id:"SYSTEM",action,detail});save()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function fmt(v){if(!v)return"—";const d=new Date(v);return isNaN(d)?"—":d.toLocaleString()}
function login(){const id=$("loginId").value.trim().toUpperCase(),pass=$("loginPass").value,u=db.users[id];if(!u||u.active===false||String(u.password)!==String(pass)){$("loginError").textContent="Invalid User ID or password.";return}$("loginError").textContent="";localStorage.setItem(SESSIONKEY,id);audit("LOGIN","User logged in");route()}
function logout(){if(currentUser())audit("LOGOUT","User logged out");localStorage.removeItem(SESSIONKEY);route()}
function route(){const u=currentUser();if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");$("header").classList.add("hidden");return}$("login").classList.add("hidden");$("app").classList.remove("hidden");$("header").classList.remove("hidden");$("userLine").textContent=`${u.id} • ${u.role}${u.observerType?" / "+u.observerType:""}`;buildNav(u)}
function buildNav(u){let tabs=[];if(u.role==="ADMIN")tabs=[["Dashboard",renderAdminDashboard],["Helipads",renderAdminHelipads],["Users",renderAdminUsers],["Schedules",renderAdminSchedules],["Messages",renderAdminMessages],["Records",renderAdminRecords]];else if(u.role==="CAPTURER")tabs=[["Capture",renderCapturer],["History",renderCaptureHistory]];else if(u.role==="OBSERVER"&&u.observerType==="OUTSTATION")tabs=[["Weather",renderOutstation],["Camera",renderOutCamera],["History",renderOutHistory]];else if(u.role==="OBSERVER"&&u.observerType==="INSTATION")tabs=[["My Helipads",renderInstation],["Latest Updates",renderInstationHistory]];else if(u.role==="AVIATOR")tabs=[["Latest Weather",renderAviator],["AIRREP",renderAIRREP],["Alerts",renderAviatorAlerts],["Compare",renderCompare]];const nav=$("nav");nav.innerHTML="";tabs.forEach((t,i)=>{const b=document.createElement("button");b.className="btn"+(i===0?" active":"");b.textContent=t[0];b.onclick=()=>{[...nav.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");t[1]()};nav.appendChild(b)});if(tabs[0])tabs[0][1]()}
function latestObservation(id,source){let a=db.observations.filter(o=>(o.helipad===id||o.helipadId===id)&&(!source||o.source===source));a.sort((x,y)=>new Date(y.time||y.observedAt)-new Date(x.time||x.observedAt));return a[0]||null}
function latestImage(id){return db.images.filter(i=>i.helipad===id||i.helipadId===id).sort((x,y)=>new Date(y.time||y.capturedAt)-new Date(x.time||x.capturedAt))[0]||null}
function officialObs(h){return h.mode==="OUTSTATION"?latestObservation(h.id,"OUT"):latestObservation(h.id,"IN")}
function statusFor(h){const o=officialObs(h),img=latestImage(h.id);if(!o)return img?"PURPLE":"GREY";const age=(Date.now()-new Date(o.time||o.observedAt).getTime())/60000;if(age>Number(h.validity||h.weatherValidityMinutes||30))return img?"PURPLE":"GREY";return o.systemColour||o.observerColour||"GREEN"}
function calcColour(h,d){if((h.autoColour||"ON")==="OFF")return d.observerColour;const v=Number(d.visibility),wx=d.weather||d.weatherCodes||[];if(v<Number(h.redVis||1000)||d.htStatus==="HTNV"||["TS","+RA","GR","GS"].some(x=>wx.includes(x)))return"RED";if(v<Number(h.yellowVis||3000)||d.htStatus==="HTPV"||["RA","FG","BR"].some(x=>wx.includes(x)))return"YELLOW";return"GREEN"}
function renderAdminDashboard(){const hs=Object.values(db.helipads).filter(h=>h.active!==false),counts={GREEN:0,YELLOW:0,RED:0,PURPLE:0,GREY:0};hs.forEach(h=>counts[statusFor(h)]++);$("content").innerHTML=`<div class="grid g4"><div class="kpi">HELIPADS<b>${hs.length}</b></div><div class="kpi">ACTIVE USERS<b>${Object.values(db.users).filter(u=>u.active!==false).length}</b></div><div class="kpi">OBSERVATIONS<b>${db.observations.length}</b></div><div class="kpi">IMAGES<b>${db.images.length}</b></div></div><div class="card"><div class="cardTitle">CURRENT STATUS</div><div class="cardBody grid g4">${["GREEN","YELLOW","RED","PURPLE","GREY"].map(c=>`<div class="kpi ${c}">${c}<b>${counts[c]}</b></div>`).join("")}</div></div><div class="card"><div class="cardTitle">HELIPAD STATUS</div><div class="cardBody tableWrap"><table><tr><th>Helipad</th><th>Status</th><th>Source</th><th>Latest Image</th></tr>${hs.map(h=>{const o=officialObs(h),i=latestImage(h.id),s=statusFor(h);return`<tr><td>${esc(h.id)}</td><td><span class="status ${s}">${s}</span></td><td>${o?esc(o.source):"—"}</td><td>${i?fmt(i.time||i.capturedAt):"NO IMAGE"}</td></tr>`}).join("")}</table></div></div>`}
function renderAdminHelipads(){$("content").innerHTML=`<div class="card"><div class="cardTitle">CREATE / UPDATE HELIPAD</div><div class="cardBody grid g2"><div><label>Helipad Name / ID</label><input id="hName"><label>Operating Mode</label><select id="hMode"><option value="OUTSTATION">Outstation Observer</option><option value="CAP_IN">Capturer + Instation Observer</option></select><label>Active Views</label><select id="hViews"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></div><div><label>Weather Validity (minutes)</label><input id="hValidity" value="30" type="number"><label>Automatic Colour</label><select id="hAuto"><option>ON</option><option>OFF</option></select><label>RED below visibility (m)</label><input id="hRed" value="1000" type="number"><label>YELLOW below visibility (m)</label><input id="hYellow" value="3000" type="number"></div></div><div class="cardBody"><button class="btn primary" id="saveHelipadBtn">SAVE HELIPAD</button></div></div><div class="card"><div class="cardTitle">HELIPADS</div><div class="cardBody tableWrap"><table><tr><th>Helipad</th><th>Mode</th><th>Status</th><th>Views</th><th>Action</th></tr>${Object.values(db.helipads).map(h=>`<tr><td>${esc(h.id)}</td><td>${esc(h.mode)}</td><td><span class="status ${statusFor(h)}">${statusFor(h)}</span></td><td>${h.views}</td><td><button class="btn" data-view="${esc(h.id)}">REFERENCE IMAGES</button> <button class="btn danger" data-toggle-h="${esc(h.id)}">${h.active===false?"RESTORE":"ARCHIVE"}</button></td></tr>`).join("")}</table></div></div>`;$("saveHelipadBtn").onclick=saveHelipad;$("content").querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>configureViews(b.dataset.view));$("content").querySelectorAll("[data-toggle-h]").forEach(b=>b.onclick=()=>{const h=db.helipads[b.dataset.toggleH];h.active=h.active===false;save();audit("TOGGLE_HELIPAD",h.id);renderAdminHelipads()})}
function saveHelipad(){const id=$("hName").value.trim().toUpperCase();if(!id)return alert("Enter helipad name.");const views=Number($("hViews").value),old=db.helipads[id]||{};let vc=Array.isArray(old.viewConfig)?old.viewConfig.slice(0,views):[];while(vc.length<views){const i=vc.length;vc.push({id:"V"+(i+1),label:"VIEW "+(i+1),bearing:(i*90)%360,tolerance:10,reference:null})}db.helipads[id]={...old,id,active:true,mode:$("hMode").value,views,validity:Number($("hValidity").value)||30,autoColour:$("hAuto").value,redVis:Number($("hRed").value)||1000,yellowVis:Number($("hYellow").value)||3000,viewConfig:vc};save();audit("SAVE_HELIPAD",id);renderAdminHelipads()}

function drawRadial(){

    x.lineWidth=major?3:2;
    x.beginPath();x.moveTo(px,tickTop);x.lineTo(px,78);x.stroke();
    if(major){
      const b=(Math.round(base/10)*10+o+360)%360;
      x.fillStyle="#fff";x.font="bold 15px Arial";
      x.fillText(`${b}°`,px,105);
      x.font="bold 13px Arial";x.fillStyle="rgba(255,255,255,.9)";
      x.fillText(dir(b),px,124);
    }
  }
  x.shadowBlur=6;x.strokeStyle="#ffd21f";x.fillStyle="#ffd21f";x.lineWidth=5;
  x.beginPath();x.moveTo(center,22);x.lineTo(center,136);x.stroke();
  x.font="bold 15px Arial";x.fillText("CURRENT",center,158);
  const v=db.helipads[cam.helipad]?.viewConfig?.[cam.viewIndex];
  if(v){
    const delta=angleDiff(v.bearing,base);
    const clamped=Math.max(-90,Math.min(90,delta));
    const tx=center+(clamped/90)*span;
    x.strokeStyle="#ff4d4f";x.fillStyle="#ff4d4f";x.lineWidth=4;
    x.beginPath();x.moveTo(tx,16);x.lineTo(tx,75);x.stroke();
    x.font="bold 14px Arial";x.fillText("TARGET",tx,18);
  }
  if(current==null){
    x.fillStyle="rgba(0,0,0,.62)";x.fillRect(0,0,cssW,cssH);
    x.fillStyle="#ffd21f";x.font="bold 22px Arial";x.textAlign="center";
    x.fillText("COMPASS UNAVAILABLE",center,72);
    x.fillStyle="#fff";x.font="bold 15px Arial";x.fillText("Tap OVERRIDE to enter bearing manually",center,101);
  }
}

function drawEmbedded(ctx,canvas,h,v){
  const W=canvas.width,H=canvas.height,s=Math.max(1,W/1000),top=Math.round(128*s),bottom=Math.round(205*s);
  ctx.fillStyle="rgba(0,15,28,.72)";ctx.fillRect(0,0,W,top);ctx.fillRect(0,H-bottom,W,bottom);
  ctx.strokeStyle="#ffd21f";ctx.fillStyle="#ffd21f";ctx.lineWidth=Math.max(2,3*s);ctx.textAlign="center";
  const center=W/2,current=effectiveBearing();
  const base=current==null?0:current;
  for(let o=-60;o<=60;o+=10){
    const px=center+(o/60)*(W*.43),b=(Math.round(base/10)*10+o+360)%360;
    ctx.beginPath();ctx.moveTo(px,14*s);ctx.lineTo(px,45*s);ctx.stroke();
    if(o%20===0){ctx.font=`${Math.round(18*s)}px Arial`;ctx.fillText(b+"°",px,73*s)}
  }
  ctx.lineWidth=Math.max(3,5*s);ctx.beginPath();ctx.moveTo(center,8*s);ctx.lineTo(center,92*s);ctx.stroke();
  ctx.textAlign="left";ctx.font=`bold ${Math.round(30*s)}px Arial`;
  ctx.fillText(current==null?"COMPASS UNAVAILABLE":`${Math.round(current)}° ${dir(current)}${cam.override?" MANUAL":""}`,22*s,H-bottom+45*s);
  ctx.fillStyle="white";ctx.font=`${Math.round(19*s)}px Arial`;
  ctx.fillText(`${cam.helipad} • ${v.label} • TARGET ${v.bearing}° ±${v.tolerance}°`,22*s,H-bottom+78*s);
  const o=officialObs(h);
  if(o){
    ctx.fillText(`VIS ${o.visibility}m • WX ${(o.weather||o.weatherCodes||[]).join(" ")} • ${o.hillTop} • ${o.htStatus}${o.cloud?" • "+o.cloud:""}`,22*s,H-bottom+111*s);
    if(o.metar)ctx.fillText(`METAR: ${String(o.metar).slice(0,70)}`,22*s,H-bottom+142*s);
  }
  const overrideText=cam.override?` • OVERRIDE: ${cam.overrideReason}${cam.overrideRemarks?" / "+cam.overrideRemarks:""}`:"";
  ctx.fillText(`${currentUser().id} • ${new Date().toLocaleString()}${overrideText}`,22*s,H-18*s);
}
function captureImage(){

  if(b!=null&&Math.abs(angleDiff(v.bearing,b))>v.tolerance&&!cam.override)return alert("Bearing outside tolerance. Align or use override.");
  if(b==null&&!cam.override)return alert("Compass unavailable. Use override before capture.");
