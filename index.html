<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07182c">
<link rel="manifest" href="manifest.webmanifest">

<title>AWO — Aviation Weather Operations</title>

<style>
:root{
  --bg:#061527;
  --panel:#0b2746;
  --panel2:#103759;
  --panel3:#081e36;
  --text:#f6f9fc;
  --muted:#afc0d1;
  --line:#315473;
  --yellow:#ffd21f;
  --blue:#2678d9;
  --green:#159447;
  --amber:#d4a10b;
  --red:#c83232;
  --purple:#8149aa;
  --grey:#65707c;
  --input:#061a2f;
}

[data-theme="light"]{
  --bg:#eef3f8;
  --panel:#ffffff;
  --panel2:#e7edf4;
  --panel3:#f5f8fb;
  --text:#10243a;
  --muted:#5b6b7b;
  --line:#bcc8d4;
  --yellow:#9b7200;
  --input:#ffffff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background:var(--panel);
  border-bottom:2px solid var(--yellow);
}

.brand{
  color:var(--yellow);
  font-weight:900;
  font-size:18px;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.center{
  text-align:center;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 12px;
  min-height:42px;
  background:var(--panel2);
  color:var(--text);
}

.btn.primary{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
  font-weight:800;
}

.btn.success{
  background:var(--green);
  border-color:var(--green);
  color:white;
}

.btn.danger{
  background:var(--red);
  border-color:var(--red);
  color:white;
}

.btn.yellow{
  background:var(--amber);
  border-color:var(--amber);
  color:#07182c;
  font-weight:800;
}

.btn.purple{
  background:var(--purple);
  border-color:var(--purple);
  color:white;
}

main{
  max-width:1250px;
  margin:auto;
  padding:12px;
}

.loginWrap{
  min-height:100vh;
  display:grid;
  place-items:center;
}

.loginCard{
  width:min(440px,95vw);
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:16px;
  padding:24px;
}

.logo{
  width:82px;
  height:82px;
  border:3px solid var(--yellow);
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:auto;
  color:var(--yellow);
  font-weight:900;
  font-size:24px;
}

.loginCard h1{
  text-align:center;
  color:var(--yellow);
  font-size:24px;
}

label{
  display:block;
  color:var(--yellow);
  font-size:12px;
  font-weight:800;
  margin:10px 0 5px;
}

input,
select,
textarea{
  width:100%;
  min-height:44px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--input);
  color:var(--text);
}

textarea{
  min-height:90px;
}

.nav{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:12px;
}

.nav button.active{
  border-color:var(--yellow);
  color:var(--yellow);
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  margin-bottom:12px;
  overflow:hidden;
}

.cardTitle{
  padding:11px 13px;
  background:var(--panel2);
  color:var(--yellow);
  font-weight:900;
}

.cardBody{
  padding:13px;
}

.grid{
  display:grid;
  gap:10px;
}

.g2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.g3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.g4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.kpi{
  background:var(--panel3);
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px;
}

.kpi b{
  display:block;
  color:var(--yellow);
  font-size:24px;
  margin-top:5px;
}

.tableWrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th,
td{
  padding:9px;
  border:1px solid var(--line);
  font-size:12px;
  text-align:left;
}

th{
  background:var(--panel2);
  color:var(--yellow);
}

.status{
  padding:5px 9px;
  border-radius:999px;
  color:#fff;
  font-weight:800;
  display:inline-block;
}

.GREEN{
  background:var(--green);
}

.YELLOW{
  background:var(--amber);
  color:#091827;
}

.RED{
  background:var(--red);
}

.PURPLE{
  background:var(--purple);
}

.GREY{
  background:var(--grey);
}

.choiceRow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.choice{
  flex:1;
  min-width:90px;
  border:2px solid transparent;
  border-radius:10px;
  padding:13px;
  font-weight:900;
  color:#fff;
}

.choice.red{
  background:var(--red);
}

.choice.yellow{
  background:var(--amber);
  color:#07182c;
}

.choice.green{
  background:var(--green);
}

.choice.selected{
  border-color:white;
  box-shadow:0 0 0 3px var(--yellow);
}

.codeWrap{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.code{
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel3);
  color:var(--text);
  padding:8px 10px;
}

.code.selected{
  color:var(--yellow);
  border-color:var(--yellow);
}

.person{
  border:1px solid var(--line);
  background:var(--panel3);
  padding:10px;
  border-radius:8px;
  margin:5px 0;
}

.person.active{
  border-color:var(--yellow);
}

.chipGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:7px;
}

.chip{
  padding:10px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--panel3);
  color:var(--text);
}

.chip.on{
  background:var(--green);
  color:white;
}

.history{
  border-left:4px solid var(--yellow);
  padding:9px 11px;
  background:var(--panel3);
  border-radius:7px;
  margin:7px 0;
}

.imgGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:10px;
}

.imgCard{
  border:1px solid var(--line);
  background:var(--panel3);
  border-radius:10px;
  padding:8px;
}

.imgCard img{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  border-radius:7px;
}


/* CAMERA */

#cameraOverlay{
  position:fixed;
  inset:0;
  background:#000;
  z-index:100;
}

#cameraVideo,
#cameraPhoto{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cameraTop{
  position:absolute;
  top:15px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:105;
}

.cameraBadge{
  background:rgba(4,18,31,.8);
  border:1px solid var(--yellow);
  color:var(--yellow);
  padding:8px 11px;
  border-radius:9px;
  font-weight:900;
}

#guide{
  position:absolute;
  top:22%;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  border-radius:12px;
  padding:10px 18px;
  font-weight:900;
  text-align:center;
  z-index:105;
}

.guideRed{
  border:2px solid #ff4f48;
  color:#ff4f48;
}

.guideYellow{
  border:2px solid var(--yellow);
  color:var(--yellow);
}

.guideGreen{
  border:2px solid #3be277;
  color:#3be277;
}

#guideArrow{
  font-size:38px;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    opacity:.35;
  }
}

#radialCanvas{
  position:absolute;
  left:0;
  bottom:160px;
  width:100%;
  height:150px;
  z-index:104;
}

.centerPointer{
  position:absolute;
  bottom:250px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:18px solid var(--yellow);
  z-index:106;
}

.liveBearing{
  position:absolute;
  bottom:168px;
  left:50%;
  transform:translateX(-50%);
  z-index:106;
  font-size:39px;
  color:var(--yellow);
  font-weight:900;
}

.weatherOverlay{
  position:absolute;
  bottom:90px;
  left:8px;
  right:8px;
  z-index:106;
  background:rgba(5,17,28,.82);
  padding:7px;
  border-radius:8px;
  text-align:center;
  font-size:11px;
}

.cameraButtons{
  position:absolute;
  bottom:15px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:25px;
  align-items:center;
  z-index:106;
}

.shutter{
  width:70px;
  height:70px;
  border-radius:50%;
  background:white;
  border:7px solid rgba(255,255,255,.45);
}

@media(max-width:760px){

  .g2,
  .g3,
  .g4{
    grid-template-columns:1fr;
  }

  .brand{
    font-size:14px;
  }

  main{
    padding:8px;
  }

  header{
    align-items:flex-start;
  }

}
</style>
</head>


<body>

<header id="header" class="hidden">

  <div>

    <div class="brand">
      AWO — AVIATION WEATHER OPERATIONS
    </div>

    <div id="userLine" class="small"></div>

  </div>

  <div class="actions">

    <button class="btn" id="themeBtn">
      ◐
    </button>

    <button class="btn danger" id="logoutBtn">
      LOGOUT
    </button>

  </div>

</header>


<main>


<!-- LOGIN -->

<section id="login" class="loginWrap">

  <div class="loginCard">

    <div class="logo">
      AWO
    </div>

    <h1>
      AVIATION WEATHER OPERATIONS
    </h1>

    <div class="small center">
      Personal role-based weather and imagery platform
    </div>

    <label>
      User ID
    </label>

    <input
      id="loginId"
      placeholder="ARAOA"
      autocomplete="username"
    >

    <label>
      Password
    </label>

    <input
      id="loginPass"
      type="password"
      autocomplete="current-password"
    >

    <button
      class="btn primary"
      style="width:100%;margin-top:14px"
      id="loginBtn"
    >
      LOGIN
    </button>

    <p
      id="loginError"
      style="color:#ff7770"
    ></p>

    <div class="small center">
      Initial Administrator: ARAOA / 00007
    </div>

  </div>

</section>


<!-- APPLICATION -->

<section id="app" class="hidden">

  <div id="nav" class="nav"></div>

  <div id="content"></div>

</section>


</main>


<!-- CAMERA -->

<section id="cameraOverlay" class="hidden">

  <video
    id="cameraVideo"
    autoplay
    playsinline
  ></video>

  <canvas
    id="captureCanvas"
    class="hidden"
  ></canvas>

  <img
    id="cameraPhoto"
    class="hidden"
  >


  <div class="cameraTop">

    <button
      class="btn danger"
      id="closeCamera"
    >
      ✕
    </button>

    <div
      class="cameraBadge"
      id="targetBearing"
    >
      TARGET —
    </div>

    <button
      class="btn"
      id="referenceButton"
    >
      REFERENCE
    </button>

  </div>


  <div
    id="guide"
    class="guideRed"
  >

    <div id="guideText">
      TURN RIGHT
    </div>

    <div id="guideArrow">
      ›››
    </div>

  </div>


  <div class="centerPointer"></div>


  <canvas
    id="radialCanvas"
    width="1000"
    height="150"
  ></canvas>


  <div
    id="liveBearing"
    class="liveBearing"
  >
    —°
  </div>


  <div
    id="cameraWeather"
    class="weatherOverlay"
  ></div>


  <div class="cameraButtons">

    <button
      class="btn"
      id="overrideBtn"
    >
      OVERRIDE
    </button>

    <button
      class="shutter"
      id="captureBtn"
    ></button>

    <button
      class="btn"
      id="switchCamBtn"
    >
      SWITCH
    </button>

  </div>

</section>


<script>

/* =====================================================
   DATABASE
===================================================== */

const DBKEY =
  "AWO_HYBRID_DATABASE";

const OLD_DBKEY =
  "awo_v2_foundation_db";

const SESSIONKEY =
  "AWO_SESSION";


const WEATHER_CODES = [
  "NIL",
  "HZ",
  "BR",
  "FG",
  "-DZ",
  "DZ",
  "+DZ",
  "-RA",
  "RA",
  "+RA",
  "-SN",
  "SN",
  "+SN",
  "TS",
  "SHRA",
  "GR",
  "GS"
];


function createEmptyDatabase(){

  return {

    users:{},

    helipads:{},

    observations:[],

    images:[],

    airreps:[],

    tasks:[],

    messages:[],

    audit:[],

    requests:[],

    aviatorPrefs:{}

  };

}


function safeParse(value){

  if(!value){
    return null;
  }

  try{
    return JSON.parse(value);
  }
  catch(error){
    return null;
  }

}


function normalizeDatabase(raw){

  const database =
    raw &&
    typeof raw === "object"
      ? raw
      : createEmptyDatabase();


  if(
    !database.users ||
    typeof database.users !== "object" ||
    Array.isArray(database.users)
  ){
    database.users = {};
  }


  if(
    !database.helipads ||
    typeof database.helipads !== "object" ||
    Array.isArray(database.helipads)
  ){
    database.helipads = {};
  }


  if(!Array.isArray(database.observations)){
    database.observations = [];
  }

  if(!Array.isArray(database.images)){
    database.images = [];
  }

  if(!Array.isArray(database.airreps)){
    database.airreps = [];
  }

  if(!Array.isArray(database.tasks)){
    database.tasks = [];
  }

  if(!Array.isArray(database.messages)){
    database.messages = [];
  }

  if(!Array.isArray(database.audit)){
    database.audit = [];
  }

  if(!Array.isArray(database.requests)){
    database.requests = [];
  }

  if(
    !database.aviatorPrefs ||
    typeof database.aviatorPrefs !== "object"
  ){
    database.aviatorPrefs = {};
  }


  Object.values(database.users)
  .forEach(user=>{

    if(!Array.isArray(user.helipads)){
      user.helipads = [];
    }

    if(user.active === undefined){
      user.active = true;
    }

  });


  Object.values(database.helipads)
  .forEach(helipad=>{

    if(helipad.active === undefined){
      helipad.active = true;
    }

    if(helipad.validity == null){
      helipad.validity =
        helipad.weatherValidityMinutes || 30;
    }

    if(!helipad.autoColour){
      helipad.autoColour = "ON";
    }

    if(helipad.redVis == null){
      helipad.redVis = 1000;
    }

    if(helipad.yellowVis == null){
      helipad.yellowVis = 3000;
    }

    if(helipad.views == null){
      helipad.views = 4;
    }

    if(!Array.isArray(helipad.viewConfig)){

      helipad.viewConfig =
        Array.from(
          {
            length:
              Number(helipad.views || 4)
          },

          (_,index)=>({

            id:
              "V" + (index + 1),

            label:
              "VIEW " + (index + 1),

            bearing:
              (index * 90) % 360,

            tolerance:
              10,

            reference:
              null

          })
        );

    }

  });


  return database;

}


/* =====================================================
   LOAD DATABASE
===================================================== */

let db =
  safeParse(
    localStorage.getItem(DBKEY)
  );


/* Import previous Version 2 database if required */

if(!db){

  const previousDatabase =
    safeParse(
      localStorage.getItem(OLD_DBKEY)
    );


  if(previousDatabase){

    db = {

      users:
        previousDatabase.users || {},

      helipads:
        previousDatabase.helipads || {},

      observations:
        previousDatabase.observations || [],

      images:
        previousDatabase.images || [],

      airreps:
        previousDatabase.airreps || [],

      tasks:
        previousDatabase.tasks || [],

      messages:
        previousDatabase.messages || [],

      audit:
        previousDatabase.audit || [],

      requests:
        previousDatabase.requests || [],

      aviatorPrefs:
        previousDatabase.aviatorPrefs || {}

    };

  }
  else{

    db =
      createEmptyDatabase();

  }

}


db =
  normalizeDatabase(db);


/* =====================================================
   GUARANTEE PRIMARY ADMINISTRATOR
===================================================== */

const previousPrimaryAdmin =
  db.users["ARAOA"] || {};


db.users["ARAOA"] = {

  ...previousPrimaryAdmin,

  id:
    "ARAOA",

  password:
    "00007",

  role:
    "ADMIN",

  observerType:
    null,

  active:
    true,

  primary:
    true,

  helipads:
    Array.isArray(
      previousPrimaryAdmin.helipads
    )
      ? previousPrimaryAdmin.helipads
      : []

};


/* =====================================================
   STORAGE
===================================================== */

function save(){

  try{

    localStorage.setItem(
      DBKEY,
      JSON.stringify(db)
    );

    return true;

  }
  catch(error){

    alert(
      "Local storage is full or unavailable. " +
      "Large image history may need to be exported or cleared."
    );

    return false;

  }

}


save();


function currentUser(){

  const id =
    localStorage.getItem(
      SESSIONKEY
    );


  if(
    !id ||
    !db.users[id]
  ){
    return null;
  }


  return db.users[id];

}


function audit(
  action,
  detail
){

  const user =
    currentUser();


  db.audit.unshift({

    time:
      new Date().toISOString(),

    user:
      user
        ? user.id
        : "SYSTEM",

    action,

    detail

  });


  save();

}


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

  return String(
    value == null
      ? ""
      : value
  )
  .replace(
    /[&<>"']/g,
    character=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    })[character]
  );

}


function formatTime(value){

  if(!value){
    return "—";
  }


  const date =
    new Date(value);


  if(isNaN(date)){
    return "—";
  }


  return date.toLocaleString();

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

  const id =
    document
    .getElementById("loginId")
    .value
    .trim()
    .toUpperCase();


  const password =
    document
    .getElementById("loginPass")
    .value;


  const user =
    db.users[id];


  if(
    !user ||
    user.active === false ||
    String(user.password) !==
      String(password)
  ){

    document
    .getElementById("loginError")
    .textContent =
      "Invalid User ID or password.";

    return;

  }


  document
  .getElementById("loginError")
  .textContent = "";


  localStorage.setItem(
    SESSIONKEY,
    id
  );


  audit(
    "LOGIN",
    "User logged in"
  );


  route();

}


function logout(){

  if(currentUser()){

    audit(
      "LOGOUT",
      "User logged out"
    );

  }


  localStorage.removeItem(
    SESSIONKEY
  );


  route();

}


/* =====================================================
   ROUTING
===================================================== */

function route(){

  const user =
    currentUser();


  const loginPage =
    document.getElementById("login");


  const app =
    document.getElementById("app");


  const header =
    document.getElementById("header");


  if(!user){

    loginPage.classList.remove(
      "hidden"
    );

    app.classList.add(
      "hidden"
    );

    header.classList.add(
      "hidden"
    );

    return;

  }


  loginPage.classList.add(
    "hidden"
  );


  app.classList.remove(
    "hidden"
  );


  header.classList.remove(
    "hidden"
  );


  document
  .getElementById("userLine")
  .textContent =

    user.id +
    " • " +
    user.role +

    (
      user.observerType
        ? " / " +
          user.observerType
        : ""
    );


  buildNavigation(user);

}


/* =====================================================
   NAVIGATION
===================================================== */

function buildNavigation(user){

  const navigation =
    document.getElementById("nav");


  let tabs = [];


  if(user.role === "ADMIN"){

    tabs = [

      [
        "Dashboard",
        "adminDashboard"
      ],

      [
        "Helipads",
        "adminHelipads"
      ],

      [
        "Users",
        "adminUsers"
      ],

      [
        "Schedules",
        "adminSchedules"
      ],

      [
        "Messages",
        "adminMessages"
      ],

      [
        "Records",
        "adminRecords"
      ]

    ];

  }


  else if(
    user.role === "CAPTURER"
  ){

    tabs = [

      [
        "Capture",
        "capturer"
      ],

      [
        "History",
        "captureHistory"
      ]

    ];
